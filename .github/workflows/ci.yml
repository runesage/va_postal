name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, to catch breakage from new Paper builds even when nothing here changed.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    # The store tests run on MariaDB as well as SQLite (MariaDbMailStoreTest), so both dialects stay identical.
    services:
      mariadb:
        image: public.ecr.aws/docker/library/mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: postal_test
          MARIADB_USER: postal
          MARIADB_PASSWORD: postal
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTAL_TEST_MYSQL_URL: jdbc:mariadb://127.0.0.1:3306/postal_test?user=postal&password=postal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn verify
        run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v4
        with:
          name: postal-jar
          path: target/va_postal-*.jar
          if-no-files-found: error

  smoke:
    name: Smoke test on Paper ${{ matrix.paper }} (${{ matrix.storage }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # For the MySQL run (persistent-state phase P3); the SQLite run ignores it.
    services:
      mariadb:
        image: public.ecr.aws/docker/library/mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: postal
          MARIADB_USER: postal
          MARIADB_PASSWORD: postal
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Paper 26.x needs Java 25. EssentialsX 2.22.0 supports up to 26.1.2.
          - paper: "26.1.2"
            java: "25"
            storage: sqlite
          - paper: "26.1.2"
            java: "25"
            storage: mysql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v4
        with:
          name: postal-jar
          path: dist
      - name: Cache server and plugin downloads
        uses: actions/cache@v4
        with:
          path: smoke/cache
          key: smoke-${{ matrix.paper }}-${{ hashFiles('ci/smoke-test.sh') }}
      - name: Run smoke test
        env:
          PAPER_VERSION: ${{ matrix.paper }}
          WORK_DIR: smoke
          STORAGE: ${{ matrix.storage }}
        run: ci/smoke-test.sh dist/va_postal-*.jar
      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ matrix.paper }}-${{ matrix.storage }}
          path: |
            smoke/*.log
            smoke/server/logs/
            smoke/server/plugins/Postal/config.yml
          if-no-files-found: ignore

  bot:
    name: Bot player test on Paper 26.1.2
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A headless player (ci/bot, MCProtocolLib) checks what the console can't: compass targets and other
    # player-only behaviour. Runs alongside the smoke tests, so it adds no wall time.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/download-artifact@v4
        with:
          name: postal-jar
          path: dist
      - name: Cache bot dependencies and server downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            bot-work/cache
          key: bot-${{ hashFiles('ci/bot/pom.xml', 'ci/lib.sh') }}
      - name: Run bot test
        env:
          PAPER_VERSION: "26.1.2"
          WORK_DIR: bot-work
        run: ci/bot-test.sh dist/va_postal-*.jar
      - name: Upload bot and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs
          path: |
            bot-work/*.log
            bot-work/server/logs/
          if-no-files-found: ignore

  report:
    name: Open issue on failure
    needs: [build, smoke, bot]
    # Only for master and the weekly run; PR failures show on the PR itself.
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update CI failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="CI failing on ${{ github.ref_name }}"
          body="CI run failed (${{ github.event_name }}, commit ${{ github.sha }}): $RUN_URL

          Check the job output and the smoke-logs artifact for details."
          existing=$(gh issue list --state open --label ci-failure --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create ci-failure --color B60205 --description "Automated CI failure report" 2>/dev/null || true
            gh issue create --title "$title" --label ci-failure --body "$body"
          fi
