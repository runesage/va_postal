name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, to catch breakage from new Paper builds even when nothing here changed.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    # The store tests run on MariaDB as well as SQLite (MariaDbMailStoreTest), so both dialects stay identical.
    env:
      POSTAL_TEST_MYSQL_URL: jdbc:mariadb://127.0.0.1:3306/postal_test?user=postal&password=postal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Started by a script, not a service container, so a rate-limited image pull retries instead of failing the run.
      - name: Start MariaDB
        run: ci/start-mariadb.sh postal_test
      - name: mvn verify
        run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v4
        with:
          name: postal-jar
          path: target/va_postal-*.jar
          if-no-files-found: error

  smoke:
    name: Smoke test on Paper ${{ matrix.paper }} (${{ matrix.storage }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Paper 26.x needs Java 25. EssentialsX 2.22.0 supports up to 26.1.2.
          - paper: "26.1.2"
            java: "25"
            storage: sqlite
          - paper: "26.1.2"
            java: "25"
            storage: mysql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      # For the MySQL run (persistent-state phase P3) only.
      - name: Start MariaDB
        if: matrix.storage == 'mysql'
        run: ci/start-mariadb.sh postal
      - uses: actions/download-artifact@v4
        with:
          name: postal-jar
          path: dist
      - name: Cache server and plugin downloads
        uses: actions/cache@v4
        with:
          path: smoke/cache
          key: smoke-${{ matrix.paper }}-${{ hashFiles('ci/smoke-test.sh') }}
      - name: Run smoke test
        env:
          PAPER_VERSION: ${{ matrix.paper }}
          WORK_DIR: smoke
          STORAGE: ${{ matrix.storage }}
        run: ci/smoke-test.sh dist/va_postal-*.jar
      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ matrix.paper }}-${{ matrix.storage }}
          path: |
            smoke/*.log
            smoke/server/logs/
            smoke/server/plugins/Postal/config.yml
          if-no-files-found: ignore

  report:
    name: Open issue on failure
    needs: [build, smoke]
    # Only for master and the weekly run; PR failures show on the PR itself.
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update CI failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="CI failing on ${{ github.ref_name }}"
          body="CI run failed (${{ github.event_name }}, commit ${{ github.sha }}): $RUN_URL

          Check the job output and the smoke-logs artifact for details."
          existing=$(gh issue list --state open --label ci-failure --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create ci-failure --color B60205 --description "Automated CI failure report" 2>/dev/null || true
            gh issue create --title "$title" --label ci-failure --body "$body"
          fi
